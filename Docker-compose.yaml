services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shop_db
      POSTGRES_USER: shop_user
      POSTGRES_PASSWORD: dbpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  django:
    container_name: django
    build:
      context: backend
      dockerfile: Dockerfile.Dev
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - ./backend/source/media:/backend/source/media
    user: "1000:1000"
    depends_on:
      - db
    networks:
      - default
    command: "python manage.py runserver 0.0.0.0:8080"

  # adminer:
  #   container_name: adminer1
  #   image: adminer1
  #   networks:
  #     - default
  #   ports:
  #     - 8900:8080

volumes:
  postgres_data: